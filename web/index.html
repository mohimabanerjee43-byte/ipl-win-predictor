<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Win Predictor</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            text-align: center;
            padding: 40px;
        }

        h1 {
            color: #38bdf8;
        }

        .container {
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            width: 350px;
            margin: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
            border: none;
        }

        button {
            background: #38bdf8;
            color: black;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #0ea5e9;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
        }

        .bar {
            height: 20px;
            background: green;
            margin-top: 10px;
            border-radius: 10px;
            transition: width 0.5s;
        }
    </style>
</head>

<body>

    <h1>🏏 IPL Win Predictor</h1>

    <div class="container">

        <input type="number" id="current_score" placeholder="Current Score">
        <input type="number" id="balls_left" placeholder="Balls Left">
        <input type="number" id="wickets_left" placeholder="Wickets Left">
        <input type="number" step="0.1" id="run_rate" placeholder="Run Rate">
        <input type="number" step="0.1" id="required_run_rate" placeholder="Required Run Rate">

        <button onclick="predict()">Predict</button>

        <div id="result"></div>
        <div class="bar" id="bar" style="width:0%"></div>

    </div>

    <script>
        async function predict() {

            const data = {
                current_score: parseInt(document.getElementById("current_score").value),
                balls_left: parseInt(document.getElementById("balls_left").value),
                wickets_left: parseInt(document.getElementById("wickets_left").value),
                run_rate: parseFloat(document.getElementById("run_rate").value),
                required_run_rate: parseFloat(document.getElementById("required_run_rate").value)
            };

            try {
                const response = await fetch("http://127.0.0.1:8000/predict", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.error) {
                    document.getElementById("result").innerText = "Error: " + result.error;
                    return;
                }

                let probability = result.prediction * 100;

                document.getElementById("result").innerText =
                    "Win Probability: " + probability.toFixed(2) + "%";

                document.getElementById("bar").style.width = probability + "%";

            } catch (error) {
                document.getElementById("result").innerText = "Server not responding!";
            }
        }
    </script>

</body>
</html>
