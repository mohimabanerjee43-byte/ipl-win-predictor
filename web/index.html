<!DOCTYPE html>
<html>
<head>
    <title>IPL Win Predictor</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            color: black;
            padding: 25px;
            border-radius: 12px;
            width: 350px;
            text-align: center;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.2);
        }

        h2 {
            margin-bottom: 20px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            background: #1e90ff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #187bcd;
        }

        #result {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
        }

        .bar-container {
            background: #ddd;
            height: 10px;
            border-radius: 5px;
            margin-top: 10px;
        }

        #bar {
            height: 10px;
            width: 0%;
            background: green;
            border-radius: 5px;
        }

        #summary {
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>🏏 IPL Win Predictor</h2>

    <input id="score" type="number" placeholder="Current Score">
    <input id="balls" type="number" placeholder="Balls Left">
    <input id="wickets" type="number" placeholder="Wickets Left">
    <input id="runrate" type="number" step="0.1" placeholder="Run Rate">
    <input id="reqrunrate" type="number" step="0.1" placeholder="Required Run Rate">

    <button onclick="predict()">Predict</button>

    <div id="result"></div>

    <div class="bar-container">
        <div id="bar"></div>
    </div>

    <div id="summary"></div>

</div>

<script>
async function predict() {

    const score = parseFloat(document.getElementById("score").value);
    const balls = parseFloat(document.getElementById("balls").value);
    const wickets = parseFloat(document.getElementById("wickets").value);
    const runrate = parseFloat(document.getElementById("runrate").value);
    const reqrate = parseFloat(document.getElementById("reqrunrate").value);

    if (
        isNaN(score) ||
        isNaN(balls) ||
        isNaN(wickets) ||
        isNaN(runrate) ||
        isNaN(reqrate)
    ) {
        alert("Please fill all fields correctly!");
        return;
    }

    const data = {
        current_score: score,
        balls_left: balls,
        wickets_left: wickets,
        run_rate: runrate,
        required_run_rate: reqrate
    };

    const response = await fetch("http://127.0.0.1:8000/predict", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
    });

    const result = await response.json();

    const prob = result.prediction;
    const percent = (prob * 100).toFixed(2);

    document.getElementById("result").innerText =
        "Winning Probability: " + percent + "%";

    document.getElementById("bar").style.width = percent + "%";

    let summary;
    if (prob > 0.7) summary = "🔥 Batting team strongly ahead";
    else if (prob > 0.5) summary = "🙂 Batting team slightly ahead";
    else if (prob > 0.3) summary = "⚖️ Match is balanced";
    else summary = "🎯 Bowling team in control";

    document.getElementById("summary").innerText = summary;
}
</script>

</body>
</html>
